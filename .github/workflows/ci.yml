name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch to avoid wasted minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Cypress test matrix: ui & api suites run in parallel
  # ──────────────────────────────────────────────────────────────────────────
  cypress:
    name: Cypress (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [ui, api]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Create report directories
        run: mkdir -p reports/mochawesome

      - name: Run Cypress — ${{ matrix.suite }}
        run: npm run cy:${{ matrix.suite }}

      - name: Upload mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-${{ matrix.suite }}
          path: reports/mochawesome/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Newman: run the Postman collection as a separate job
  # ──────────────────────────────────────────────────────────────────────────
  newman:
    name: Newman (Postman collection)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create report directories
        run: mkdir -p reports/newman reports/mochawesome

      - name: Run Newman
        run: npm run api:newman

      - name: Upload Newman HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: reports/newman/
          retention-days: 7
